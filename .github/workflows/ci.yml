name: CI

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    working-directory: apps/web

jobs:
  lint-typecheck-unit:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test

  # Runs against the local dev server (no Supabase project required) — security headers and the
  # unauthenticated-redirect check. Kept separate from integration-e2e below because it needs no
  # secrets and should never be skipped.
  e2e-no-backend:
    name: Playwright (no backend required)
    runs-on: ubuntu-latest
    needs: lint-typecheck-unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test e2e/security-headers.spec.ts
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: build-time-placeholder
          DATABASE_URL: postgres://placeholder:placeholder@localhost:5432/placeholder

  # Only runs once a real Supabase test project's connection string is stored as a repo secret —
  # see docs/system-architecture.md §9. Absent that secret this job is skipped, not failed, so CI
  # stays green on forks / before infrastructure exists.
  integration-e2e:
    name: RLS integration + Playwright E2E (requires Supabase)
    runs-on: ubuntu-latest
    needs: lint-typecheck-unit
    if: ${{ vars.HAS_SUPABASE_TEST_PROJECT == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run db:migrate
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_TEST_DB_URL }}
      - run: npx vitest run --config vitest.integration.config.ts
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_TEST_DB_URL }}
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test e2e/auth-and-approval.spec.ts
        env:
          PLAYWRIGHT_BASE_URL: ${{ secrets.SAFEGUARD_E2E_BASE_URL }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 14

  build:
    name: Next.js build
    runs-on: ubuntu-latest
    needs: lint-typecheck-unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL_DEV || 'http://localhost:54321' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY_DEV || 'build-time-placeholder' }}
          DATABASE_URL: postgres://placeholder:placeholder@localhost:5432/placeholder
